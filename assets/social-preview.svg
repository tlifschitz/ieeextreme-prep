<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g font-family="Menlo, Monaco, 'Courier New', monospace">
    <text x="80" y="150" font-size="30" fill="#7dd3fc">$ git clone tlifschitz/ieeextreme-prep</text>
    <text x="80" y="250" font-size="84" font-weight="700" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif">ieeextreme-prep</text>
    <text x="80" y="320" font-size="38" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif">Practice IEEEXtreme with an AI tutor</text>
    <text x="80" y="368" font-size="38" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif">that never writes your code.</text>
  </g>
  <!-- the help ladder: steps 0 to 5, then give up -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0b1220" font-weight="700">
    <rect x="80"  y="520" width="140" height="40" rx="6" fill="#334155"/><text x="92"  y="547" fill="#e2e8f0">0 advice</text>
    <rect x="235" y="490" width="140" height="70" rx="6" fill="#1e40af"/><text x="247" y="547" fill="#e2e8f0">1 questions</text>
    <rect x="390" y="460" width="140" height="100" rx="6" fill="#1d4ed8"/><text x="402" y="547" fill="#e2e8f0">2 signals</text>
    <rect x="545" y="430" width="140" height="130" rx="6" fill="#2563eb"/><text x="557" y="547" fill="#e2e8f0">3 technique</text>
    <rect x="700" y="400" width="140" height="160" rx="6" fill="#3b82f6"/><text x="712" y="547" fill="#0b1220">4 insight</text>
    <rect x="855" y="370" width="140" height="190" rx="6" fill="#60a5fa"/><text x="867" y="547" fill="#0b1220">5 the idea</text>
    <rect x="1010" y="340" width="140" height="220" rx="6" fill="#f59e0b"/><text x="1022" y="547" fill="#0b1220">give up</text>
  </g>
  <text x="80" y="610" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">252 problems · IEEEXtreme 10–19 · hints one step at a time · local judge · Claude Code</text>
